{% extends 'base.html' %}
{% load static %}

{% block content %}

<section class="section-content padding-y bg">
    <div class="container">

        <!-- ============================ COMPONENT 1 ================================= -->
        <div class="row">
            <aside class="col-lg-6">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title mb-4">Billing Address</h4>
                        <form action="{% url 'place_order' %}" method="POST">
                            {% csrf_token %}
                        <div class="form-row">
                            <div class="col form-group">
                                <label for="">First Name</label>
                                <input type="text" name="first_name" class="form-control" value="{{ initial.first_name }}" required>
                            </div>
                            <div class="col form-group">
                                <label for="">Last Name</label>
                                <input type="text" name="last_name" class="form-control" value="{{ initial.last_name }}" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="col form-group">
                                <label for="">Email</label>
                                <input type="email" name="email" class="form-control" value="{{ initial.email }}" required>
                            </div>
                            <div class="col form-group">
                                <label for="">Phone Number</label>
                                <input type="text" name="phone" class="form-control" value="{{ initial.phone }}" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="col form-group">
                                <label for="">Address Line 1</label>
                                <input type="text" name="address_line_1" class="form-control" value="{{ initial.address_line_1 }}" required>
                            </div>
                            <div class="col form-group">
                                <label for="">Address Line 2</label>
                                <input type="text" name="address_line_2" class="form-control" value="{{ initial.address_line_2 }}">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="col form-group">
                                <label for="">City</label>
                                <input type="text" name="city" class="form-control" value="{{ initial.city }}" required>
                            </div>
                            <div class="col form-group">
                                <label for="">State</label>
                                <input type="text" name="state" class="form-control" value="{{ initial.state }}" required>
                            </div>
                            <div class="col form-group">
                                <label for="">Country</label>
                                <input type="text" name="country" class="form-control" value="{{ initial.country }}" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <label for="">Order Note</label>
                            <textarea name="order_note" rows="2" class="form-control">{{ initial.order_note }}</textarea>
                        </div>

                        
                    </div>
                </div> <!-- card.// -->

            </aside> <!-- col.// -->
            <aside class="col-lg-6">

                <div class="card">
                    <div class="card-body">
                        <table class="table table-borderless table-shopping-cart">
                        <thead class="text-muted">
                            <tr class="small text-uppercase">
                                <th scope="col">Product</th>
                                <th scope="col">Quantity</th>
                                <th scope="col">Price</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for cart_item in cart_items %}
                            <tr>
                                <td data-label="Product">
                                    <figure class="itemside align-items-center">
                                        <div class="aside"><img src="{{ cart_item.product.images.url }}" class="img-sm">
                                        </div>
                                        <figcaption class="info">
                                            <a href="{{ cart_item.product.get_url }}" class="title text-dark">
                                                {{ cart_item.product.product_name }}</a>
                                            <p class="text-muted small">
                                                {% if cart_item.attribute_values.all %}
                                                {% for item in cart_item.attribute_values.all %}
                                                {{ item.attribute.name | capfirst }} : {{ item.value | capfirst }}<br>
                                                {% endfor %}
                                                {% endif %}
                                            </p>
                                        </figcaption>
                                    </figure>
                                </td>
                                <td data-label="Quantity">
                                    <label for="">{{ cart_item.quantity }}</label>
                                </td>
                                <td data-label="Price">
                                    <div class="price-wrap">
                                        <var class="price">LKR {{ cart_item.sub_total }}</var>
                                        <small class="text-muted"> LKR {{ cart_item.price }} each </small>
                                    </div> <!-- price-wrap .// -->
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                        <button type="submit" name="submit" class="btn btn-primary btn-block">Place Order</button>
                        <a href="{% url 'store' %}" class="btn btn-light btn-block">Continue Shopping</a>
                        </form>
                    </div> <!-- card-body.// -->
                </div> <!-- card.// -->

            </aside> <!-- col.// -->


        </div> <!-- row.// -->
        <!-- ============================ COMPONENT 1 END .// ================================= -->

    </div> <!-- container .//  -->
</section>
<!-- ========================= SECTION CONTENT END// ========================= -->

{% endblock %}
