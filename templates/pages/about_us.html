{% extends 'base.html' %}
{% load static %}

{% block content %}

<section class="section-content padding-y bg">
    <div class="container">
        <h2 class="mb-4">About Us</h2>
        <div class="row">
            <div class="col-md-8">
                {{ company.about_us|safe }}
            </div>
            <aside class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h6 class="card-title">Visit Our Store</h6>
                        <p class="card-text text-muted">
                            {{ company.address }}
                        </p>
                        <p class="card-text text-muted">
                            <i class="fa fa-envelope mr-2"></i> {{ company.email }}
                        </p>
                        <p class="card-text text-muted">
                            <i class="fa fa-phone mr-2"></i> {{ company.phone }}
                        </p>
                    </div>
                </div>
            </aside>
        </div>
    </div>
</section>

{% endblock %}
